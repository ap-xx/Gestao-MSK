# ============================================================
# Render Blueprint — MSK Consultation Backend
# ============================================================

services:
  - type: web
    name: msk-api
    runtime: node
    region: ohio
    plan: free

    # npm ci --include=dev garante que @types/* sejam instalados para o tsc
    buildCommand: cd server && npm ci --include=dev && npm run build

    startCommand: cd server && node dist/index.js

    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GMAIL_USER_ADMIN
        value: gabrielb.arins@gmail.com
      - key: GMAIL_APP_PASSWORD_ADMIN
        sync: false
      - key: GMAIL_USER_ADVOGADO
        value: miriamkuchnier.adv@gmail.com
      - key: GMAIL_APP_PASSWORD_ADVOGADO
        sync: false
      - key: GMAIL_USER_ASSISTENTE
        value: andreluizbudalarins@gmail.com
      - key: GMAIL_APP_PASSWORD_ASSISTENTE
        sync: false
